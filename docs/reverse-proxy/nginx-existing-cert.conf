# Aayu behind nginx when you ALREADY have a certificate for the domain — a
# wildcard, or one issued by something other than certbot.
#
# Use docs/reverse-proxy/nginx.conf instead if you are letting certbot issue
# the certificate; it writes a block like this one for you.
#
# The certificate paths must exist before you reload, or `nginx -t` fails.
#
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # Add `listen [::]:80;` if this server has IPv6. nginx refuses to start
    # without it where the address family is unavailable.
    server_name health.example.com;
    return 301 https://$host$request_uri;
}

server {
    # `http2 on;` is nginx 1.25+. On 1.24 and earlier write `listen 443 ssl http2;`
    # instead. Ubuntu 24.04 ships 1.24 — check with `nginx -v`.
    listen 443 ssl;
    server_name health.example.com;

    ssl_certificate     /etc/letsencrypt/live/health.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health.example.com/privkey.pem;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
