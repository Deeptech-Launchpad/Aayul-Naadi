# Aayu behind an existing Apache.
#
#   sudo a2enmod proxy proxy_http headers
#   sudo cp docs/reverse-proxy/apache.conf /etc/apache2/sites-available/aayu.conf
#   sudo a2ensite aayu && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d health.example.com
#
# Replace health.example.com and 3000 with your domain and AAYU_PORT.

<VirtualHost *:443>
    ServerName health.example.com

    SSLEngine on
    # certbot fills these in.
    # SSLCertificateFile    /etc/letsencrypt/live/health.example.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/health.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}s"

    # Nadi streams its answers; without this Apache buffers them.
    SetEnv proxy-sendchunked 1
    ProxyTimeout 300
</VirtualHost>
