# Aayu behind an existing nginx — the vhost to install FIRST.
#
# It listens on port 80 only. That is deliberate: certbot needs a working
# port-80 server block with the right server_name to validate the domain, and
# it then writes the TLS block itself. A vhost that declares `listen 443 ssl`
# before a certificate exists fails `nginx -t`, which on a box already serving
# other sites means the reload is refused — or, worse, a restart takes those
# sites down.
#
#   sudo cp docs/reverse-proxy/nginx.conf /etc/nginx/sites-available/aayu
#   sudo ln -s /etc/nginx/sites-available/aayu /etc/nginx/sites-enabled/aayu
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d health.example.com
#
# certbot rewrites this file: it adds the 443 server block, points it at the
# certificate, and turns this block into a redirect. Nothing else to do.
#
# Replace health.example.com with your domain and 3000 with your AAYU_PORT.

server {
    listen 80;
    # Add `listen [::]:80;` if this server has IPv6. nginx refuses to start
    # without it where the address family is unavailable.
    server_name health.example.com;

    # A photographed lab report can be several MB; the app's own limit is 25 MB.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        # $http_host, not $host: it preserves the port the browser used, which
        # is what Next compares the Origin header against.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;

        # $scheme, never a hardcoded "https". Advertising https on a listener
        # that serves plain http makes the browser upgrade every asset URL and
        # the app loads as a blank page. certbot leaves this correct.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next validates Server Actions against the forwarded host. Get these
        # wrong and every form in the app fails with "Invalid Server Actions
        # request".

        # Nadi streams its answers token by token. Without these two, nginx
        # buffers the whole reply and the chat appears to hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
